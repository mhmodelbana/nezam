<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f6f1">
  <meta name="description" content="بوابة طالب Vota Travel.">
  <title>بوابة الطالب | Vota Travel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js" defer></script>
  <script src="supabase-data.js" defer></script>
  <script src="supabase-api.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body class="dashboard-page portal-page">
  <header class="topbar">
    <a class="brand" href="portal.html" aria-label="بوابة Vota Travel">
      <span class="brand-mark" aria-hidden="true">v.</span>
      <span>Vota <strong>Travel</strong></span>
    </a>
    <div class="date-time" aria-label="التاريخ والوقت">
      <span id="current-date"></span>
      <span class="date-time-divider" aria-hidden="true"></span>
      <time id="current-time"></time>
    </div>
    <a class="logout-link" href="index.html">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M8 3.5H4.5v13H8m3-3 3.5-3.5L11 6.5M7 10h8.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>تسجيل الخروج</span>
    </a>
  </header>

  <main class="portal-content" id="student-portal" data-portal-section="home">
    <p class="portal-message" id="portal-message" role="status" hidden></p>
    <section class="portal-password-panel" id="portal-password-section" hidden>
      <span class="eyebrow"><span></span> خطوة مطلوبة</span>
      <h1>أنشئ كلمة مرور جديدة</h1>
      <p>غيّر كلمة المرور المؤقتة قبل متابعة ملفك.</p>
      <form class="portal-password-form" id="portal-password-form">
        <label class="form-field"><span>كلمة المرور الجديدة</span><input name="newPassword" type="password" minlength="10" autocomplete="new-password" required></label>
        <label class="form-field"><span>تأكيد كلمة المرور</span><input name="confirmPassword" type="password" minlength="10" autocomplete="new-password" required></label>
        <p class="form-error" id="portal-password-error" role="alert"></p>
        <button class="primary-button" type="submit">حفظ كلمة المرور ومتابعة</button>
      </form>
    </section>

    <section class="portal-home" id="portal-profile" hidden>
      <div class="portal-home-heading">
        <span class="eyebrow"><span></span> بوابة الطالب</span>
        <h1>أهلاً بيك، <span id="portal-student-name"></span></h1>
        <p>اختار القسم اللي تحب تتابعه.</p>
      </div>
      <nav class="dashboard portal-dashboard" aria-label="أقسام بوابة الطالب">
        <a class="module-card students-card" href="portal-personal.html" aria-label="بياناتي الشخصية">
          <span class="module-icon students-icon" aria-hidden="true">
            <svg viewBox="0 0 28 28" fill="none"><circle cx="10" cy="9" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 22v-1.5a6.5 6.5 0 0 1 13 0V22h-13Zm15-11.5a3.5 3.5 0 1 0 0-7m1 11a5.5 5.5 0 0 1 5 5.5V22h-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="module-label">بياناتي الشخصية</span>
        </a>
        <a class="module-card subscriptions-card" href="portal-subscription.html" aria-label="اشتراكي">
          <span class="module-icon subscriptions-icon" aria-hidden="true">
            <svg viewBox="0 0 28 28" fill="none"><rect x="3.5" y="5" width="21" height="18" rx="4" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 11h21M8 17h4m-4 3h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="20" cy="17" r="2" fill="currentColor"/></svg>
          </span>
          <span class="module-label">اشتراكي</span>
        </a>
        <a class="module-card settings-card" href="portal-trips.html" aria-label="تسجيل الرحلات">
          <span class="module-icon settings-icon" aria-hidden="true">
            <svg viewBox="0 0 28 28" fill="none"><path d="M3.5 18.5h21l-2.1-7.3a2.5 2.5 0 0 0-2.4-1.8H8a2.5 2.5 0 0 0-2.4 1.8l-2.1 7.3Zm0 0v2m21-2v2M7.5 18.5v-2m13 2v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="21" r="1.5" fill="currentColor"/><circle cx="20" cy="21" r="1.5" fill="currentColor"/></svg>
          </span>
          <span class="module-label">تسجيل الرحلات</span>
        </a>
      </nav>
    </section>
  </main>
</body>
</html>
